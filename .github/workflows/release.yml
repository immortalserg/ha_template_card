name: Publish HACS release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -oE 'ha_template_card v[0-9]+\.[0-9]+\.[0-9]+' ha-template-card.js | head -1 | awk '{print $2}')
          test -n "$version"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release already exists"
          else
            gh release create "$version" ha-template-card.js --target "$GITHUB_SHA" --title "ha_template_card $version" --generate-notes --latest
          fi
